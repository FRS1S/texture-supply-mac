<title>Texture Supply by piraru*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@700;800&family=VT323&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  /* identidade piraru*, tema escuro: preto como base, verde-limão #B6FF00 como destaque */
  --bg:#0A0A0A; --panel:#111210; --panel-2:#1A1C17; --ink:#EEF1E8; --muted:#8C9480;
  --line:#272A22; --stage:#050505; --dot:rgba(182,255,0,.075); --accent:#B6FF00; --accent-ink:#0A0A0A;
  --accent-2:#658E00; --accent-line:#B6FF00; --on-bg:transparent; --range:#B6FF00; --focus:#B6FF00;
  --by-fg:#B6FF00; --by-bg:transparent; --by-pad:0; --hair:rgba(255,255,255,.16); --backdrop:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.6),0 14px 50px rgba(0,0,0,.75);
  color-scheme:dark;
}
/* tema claro (Configurações): branco como base, preto para textos, verde para detalhes */
:root[data-ui="light"]{
  --bg:#F2F3EF; --panel:#FFFFFF; --panel-2:#F5F6F2; --ink:#0A0A0A; --muted:#5C6254;
  --line:#DDE0D7; --stage:#E7E9E2; --dot:rgba(10,10,10,.09); --accent:#B6FF00; --accent-ink:#0A0A0A;
  --accent-2:#0A0A0A; --accent-line:#0A0A0A; --on-bg:#B6FF00; --range:#8FCC00; --focus:#0A0A0A;
  --by-fg:#0A0A0A; --by-bg:#B6FF00; --by-pad:2px 8px; --hair:rgba(0,0,0,.18); --backdrop:rgba(10,10,10,.35);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 12px 36px rgba(30,40,20,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;height:100%;grid-template-columns:348px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"head head" "panel stage"}
header{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;font-family:Sora,"Segoe UI",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.1;color:var(--ink)}
.logo .name{white-space:nowrap}
.logo em{font-style:normal;color:var(--accent)}
:root[data-ui="light"] .logo em{color:var(--ink)}
.logo .by{font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap;color:var(--by-fg);background:var(--by-bg);padding:var(--by-pad);border-radius:4px}
.logo .by sup{font-size:.72em;line-height:0;margin-left:1px}
.tag{font:500 11px/1.2 "IBM Plex Mono",ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.brand{display:flex;flex-direction:column;gap:4px;margin-right:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel-2);cursor:pointer;white-space:nowrap;font-weight:500;font-size:13px;user-select:none;-webkit-user-select:none}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:15px;height:15px;flex:none}
select.sel{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px;font-size:13px}

aside{grid-area:panel;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 10px}
.sec-h h2{margin:0;font:600 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgroup{grid-column:1/-1;display:flex;align-items:center;gap:6px;font:600 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 0 4px;background:none;border:0;cursor:pointer;text-align:left}
.pgroup:hover{color:var(--ink)}
.pg-arrow{width:10px;color:var(--accent-line)}
.pg-count{margin-left:auto;font-weight:500;opacity:.7}
.pgroup:first-child{padding-top:0}
.preset{display:flex;flex-direction:column;gap:5px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;text-align:left}
.preset:hover{border-color:var(--accent-2)}
.preset.on{outline:2px solid var(--accent-line);outline-offset:-1px;border-color:var(--accent-line)}
.preset.on span{color:var(--accent-line);background:var(--on-bg);border-radius:3px;align-self:flex-start;padding:1px 4px}
.preset canvas{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;background:var(--stage);display:block}
.preset span{font-size:12px;font-weight:500;line-height:1.2;padding:0 2px 2px}
.rand{width:100%;justify-content:center;margin-top:8px}

details{border-top:1px solid var(--line);padding:2px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  font:600 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:16px;color:var(--accent-line)}
details[open] summary::after{content:"–"}
summary small{font:400 11px "IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:8px;margin-right:auto}
.fields{display:flex;flex-direction:column;gap:12px;padding:0 0 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.field output{font:500 12px "IBM Plex Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.field .note{font:400 11px "IBM Plex Mono",monospace;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--range);margin:0;height:18px}
.field select,.field input[type=text]{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px;width:100%}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;flex:none}
.colorrow code{font:500 12px "IBM Plex Mono",monospace;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{width:18px;height:18px;border-radius:3px;border:1px solid var(--hair);cursor:pointer;padding:0}
.chip:hover{transform:scale(1.15)}
.check{flex-direction:row;align-items:center;justify-content:space-between}
.check input{width:18px;height:18px;accent-color:var(--range)}
.seedrow{display:flex;gap:8px}
.seedrow input{flex:1;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px;font-family:"IBM Plex Mono",monospace}

main{grid-area:stage;display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;background:var(--stage);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);background-size:11px 11px}
.view{position:relative;overflow:auto;display:flex;min-height:0;padding:24px}
.view canvas{margin:auto;box-shadow:var(--shadow);display:block;flex:none}
.view.pan{cursor:grab}
.view.pan.dragging{cursor:grabbing}
.view.pan canvas{pointer-events:none}
.busy{position:absolute;top:12px;right:12px;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;
  background:var(--panel);border:1px solid var(--line);padding:5px 9px;border-radius:99px;display:flex;gap:6px;align-items:center}
.busy i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.cmp-badge{position:absolute;top:12px;left:12px;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:5px 9px;border-radius:99px}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent-line);border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--panel) 80%,transparent);font-weight:600}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);
  font:400 12px "IBM Plex Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.inkchips{display:flex;flex-wrap:wrap;gap:6px 10px;margin-left:auto}
.inkchips span{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.inkchips b{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--hair)}
.zoombar{display:flex;align-items:center;gap:6px;margin-left:12px;color:var(--ink)}
.zb{width:24px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);cursor:pointer;line-height:1;font-size:15px;padding:0}
.zb:hover{border-color:var(--accent-2)}
#zoom-range{width:110px;height:16px}
#zoom-pct{width:48px;height:24px;text-align:right;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);font:inherit;padding:0 5px}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:5px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.field .lbl{font-size:13px}
.num{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px;width:100%;
  font:500 13px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.orient{display:flex;gap:6px}
.orient button{width:38px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;display:grid;place-items:center;padding:0}
.orient button svg{width:18px;height:18px}
.orient button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.orient button:disabled{opacity:.35;cursor:not-allowed}
.dpirow{display:flex;align-items:center;gap:8px}
.dpirow .num{width:96px}
.dpirow span{font:500 12px "IBM Plex Mono",monospace;color:var(--muted)}
.binfo{font:400 11px/1.5 "IBM Plex Mono",monospace;color:var(--muted)}
.binfo b{font-weight:500;color:var(--ink)}
.binfo .warn{color:var(--accent-line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:500;
  padding:9px 14px;border-radius:6px;font-size:13px;z-index:10;max-width:calc(100% - 32px)}

.btn.icon{width:34px;padding:0;justify-content:center}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.histbtns{display:flex;gap:4px}
.btn.icon svg{width:17px;height:17px}
dialog.settings{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;
  width:min(440px,calc(100% - 32px));box-shadow:var(--shadow)}
dialog.settings::backdrop{background:var(--backdrop)}
.set-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0;font:700 17px/1.2 Sora,"Segoe UI",sans-serif;letter-spacing:-.01em}
.set-body{display:flex;flex-direction:column;gap:18px;padding:18px}
.set-group{display:flex;flex-direction:column;gap:8px}
.set-group>span{font:600 12px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2)}
.seg button{flex:1;height:38px;border:0;background:transparent;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg i{width:12px;height:12px;border-radius:50%;border:1px solid var(--hair);display:inline-block}
.set-foot{padding:0 18px 16px;font-size:12px;color:var(--muted)}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"head" "stage" "panel"}
  main{height:62vh;min-height:360px}
  aside{border-right:0;border-top:1px solid var(--line);overflow:visible}
  .view{padding:14px}
  .presets{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:420px){ .presets{grid-template-columns:1fr 1fr} .logo{font-size:19px} .logo .by{font-size:15px} }
@media (prefers-reduced-motion:reduce){ .busy i{animation:none} .chip:hover{transform:none} }
</style>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo"><span class="name">Texture Supply<em>.</em></span><span class="by">by piraru<sup>*</sup></span></div>
      <div class="tag">For true designers &amp; new solutions</div>
    </div>
    <div class="tools">
      <div class="histbtns" role="group">
        <button class="btn icon" id="btn-undo" type="button" disabled data-i18n-title="Desfazer (Ctrl+Z)" data-i18n-aria="Desfazer (Ctrl+Z)" title="Desfazer (Ctrl+Z)" aria-label="Desfazer (Ctrl+Z)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5 3.5 9l4 4"/><path d="M4 9h8a4.5 4.5 0 0 1 0 9H9"/></svg></button>
        <button class="btn icon" id="btn-redo" type="button" disabled data-i18n-title="Refazer (Ctrl+Shift+Z)" data-i18n-aria="Refazer (Ctrl+Shift+Z)" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer (Ctrl+Shift+Z)">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12.5 5 4 4-4 4"/><path d="M16 9H8a4.5 4.5 0 0 0 0 9h3"/></svg></button>
      </div>
      <button class="btn" id="btn-open" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 11v3h12v-3M8 2v9M4.5 5.5 8 2l3.5 3.5"/></svg><span data-i18n="Abrir imagem">Abrir imagem</span></button>
      <select class="sel" id="sample" data-i18n-aria="Imagem de amostra" aria-label="Imagem de amostra">
        <option value="sunset" data-i18n="Amostra: pôr do sol">Amostra: pôr do sol</option>
        <option value="chart" data-i18n="Amostra: carta de teste">Amostra: carta de teste</option>
        <option value="user" hidden data-i18n="Sua imagem">Sua imagem</option>
      </select>
      <button class="btn" id="btn-cmp" type="button" data-i18n-title="Segure para ver a imagem original" title="Segure para ver a imagem original" data-i18n="Segure p/ comparar">Segure p/ comparar</button>
      <select class="sel" id="exp-scale" data-i18n-aria="Resolução de exportação" aria-label="Resolução de exportação"></select>
      <button class="btn" id="btn-seps" type="button" data-i18n-title="Um PNG por tinta, pronto para fotolito ou tela" title="Um PNG por tinta, pronto para fotolito ou tela" data-i18n="Separações .zip">Separações .zip</button>
      <button class="btn primary" id="btn-export" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 11v3h12v-3M8 2v9M4.5 7.5 8 11l3.5-3.5"/></svg><span data-i18n="Exportar PNG">Exportar PNG</span></button>
      <button class="btn icon" id="btn-settings" type="button" data-i18n-title="Configurações" data-i18n-aria="Configurações" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5.5h8M15 5.5h2M3 10h3M10 10h7M3 14.5h9M16 14.5h1"/><circle cx="13" cy="5.5" r="2"/><circle cx="8" cy="10" r="2"/><circle cx="14" cy="14.5" r="2"/></svg></button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </header>

  <aside id="panel">
    <div class="sec-h"><h2 data-i18n="Receitas">Receitas</h2><span class="tag" id="preset-name">—</span></div>
    <div class="presets" id="presets"></div>
    <button class="btn rand" id="btn-rand" type="button" data-i18n="Surpreenda-me">Surpreenda-me</button>
    <div id="controls" style="margin-top:16px"></div>
  </aside>

  <main>
    <div class="view" id="view">
      <canvas id="out" width="10" height="10" data-i18n-aria="Resultado processado" aria-label="Resultado processado"></canvas>
      <canvas id="src" width="10" height="10" hidden data-i18n-aria="Imagem original" aria-label="Imagem original"></canvas>
      <div class="busy" id="busy" hidden><i></i><span data-i18n="Processando">Processando</span></div>
      <div class="cmp-badge" id="cmp-badge" hidden data-i18n="Original">Original</div>
      <div class="drop" id="drop" hidden data-i18n="Solte a imagem aqui">Solte a imagem aqui</div>
    </div>
    <div class="status">
      <span id="st-size">—</span><span id="st-time"></span>
      <div class="inkchips" id="st-inks"></div>
      <div class="zoombar" role="group" aria-label="Zoom" data-i18n-title="Alt + rolagem ou pinça no touchpad para zoom · Espaço + arrastar para mover" title="Alt + rolagem ou pinça no touchpad para zoom · Espaço + arrastar para mover">
        <button class="zb" id="zoom-out" type="button" data-i18n-aria="Diminuir zoom" aria-label="Diminuir zoom">−</button>
        <input type="range" id="zoom-range" min="-564" max="300" step="1" aria-label="Zoom">
        <button class="zb" id="zoom-in" type="button" data-i18n-aria="Aumentar zoom" aria-label="Aumentar zoom">+</button>
        <input type="text" id="zoom-pct" inputmode="numeric" aria-label="Zoom %"><span>%</span>
        <button class="btn sm" id="zoom-fit" type="button" data-i18n="Ajustar" data-i18n-title="Ajustar à tela" title="Ajustar à tela">Ajustar</button>
        <button class="btn sm" id="btn-zoom" type="button" data-i18n-title="Tamanho real (100%)" title="Tamanho real (100%)">100%</button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<dialog class="settings" id="settings" aria-labelledby="set-title">
  <div class="set-head"><h2 id="set-title" data-i18n="Configurações">Configurações</h2>
    <button class="btn icon" id="set-close" type="button" data-i18n-title="Fechar" data-i18n-aria="Fechar" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div class="set-body">
    <div class="set-group"><span data-i18n="Tema">Tema</span>
      <div class="seg" id="set-theme" role="group">
        <button type="button" data-v="dark"><i style="background:#0A0A0A"></i><span data-i18n="Escuro">Escuro</span></button>
        <button type="button" data-v="light"><i style="background:#FFFFFF"></i><span data-i18n="Claro">Claro</span></button>
      </div></div>
    <div class="set-group"><span data-i18n="Idioma">Idioma</span>
      <div class="seg" id="set-lang" role="group">
        <button type="button" data-v="pt" lang="pt-BR">Português</button>
        <button type="button" data-v="en" lang="en">English</button>
        <button type="button" data-v="es" lang="es">Español</button>
      </div></div>
  </div>
  <p class="set-foot" data-i18n="As preferências ficam salvas neste computador.">As preferências ficam salvas neste computador.</p>
</dialog>

<script>
/* ============================================================
   MOTOR DE PROCESSAMENTO (roda dentro de um Web Worker)
   Autocontido: não referencia nada fora desta função.
   ============================================================ */
function engine(){
  const TAU = Math.PI*2;
  function hash(x,y,s){
    let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(s|0,1442695041))|0;
    h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16;
    return (h>>>0)/4294967296;
  }
  function vnoise(x,y,s){
    const xi=Math.floor(x), yi=Math.floor(y); let xf=x-xi, yf=y-yi;
    xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf);
    const a=hash(xi,yi,s), b=hash(xi+1,yi,s), c=hash(xi,yi+1,s), d=hash(xi+1,yi+1,s);

      if(hcy>0){ const l=.299*r+.587*g+.114*b, an=l*TAU*hcy*1.5, cc=Math.cos(an), ss=Math.sin(an);
        const Y=l, I=.596*r-.274*g-.322*b, Q=.211*r-.523*g+.312*b, I2=I*cc-Q*ss, Q2=I*ss+Q*cc;

    }

    /* 2. Separação em tintas */
    const paper=hex(p.paper), inkCols=p.inks.map(x=>hex(x.hex)), covs=[];

    else if(p.mode==='lineart'){
      const c=new Float32Array(N), sh=p.shade||0; for(let i=0;i<N;i++) c[i]=clamp01((1-Lu[i])*sh*1.3-.08); covs.push(c);
    } else if(p.mode==='comic'){
      /* quadrinhos: ciano, magenta e amarelo em poucos tons fixos (como as HQs antigas) */

      const M=dens.map((a,i)=>dens.map((b,j)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+(i===j?.02:0)));
      const Mi=invert(M), pl=paper.map(v=>Math.max(.04,v)), bv=new Array(n);
      for(let a=0;a<n;a++) covs.push(new Float32Array(N));
      for(let i=0;i<N;i++){
        const D0=-Math.log(Math.min(1,Math.max(.04,R[i]/pl[0]))), D1=-Math.log(Math.min(1,Math.max(.04,G[i]/pl[1]))), D2=-Math.log(Math.min(1,Math.max(.04,B[i]/pl[2])));
        for(let a=0;a<n;a++) bv[a]=dens[a][0]*D0+dens[a][1]*D1+dens[a][2]*D2;

      }
    }

    /* 3. Retícula */
    const scr=p.screen, s=Math.max(1,p.cell*k), Lv=Math.max(2,p.levels|0), Lm=Lv-1, outs=[];
    const cx=W/2, cy=H/2, rough=p.rough;
    for(let j=0;j<covs.length;j++){
      let cov=covs[j];
      if(p.gain){ const e=1/(1+p.gain); for(let i=0;i<N;i++) cov[i]=Math.pow(cov[i],e); }
      const O=new Float32Array(N), jsd=sd+j*131;
      if(scr==='none'){
        if(Lv>2 && p.levels<8){ for(let i=0;i<N;i++) O[i]=Math.round(cov[i]*Lm)/Lm; } else O.set(cov);

        const soft=Math.max(.3,p.softness)+.3;
        for(let y=0;y<H;y++) for(let x=0;x<W;x++){
          const i=y*W+x, v=cov[i]; let o=0;
          const rn=rough>0?(vnoise(x/(3*k),y/(3*k),jsd+7)-.5)*rough*.3:0;

        if(AM[scr] && p.preBlur>0){ const r=Math.round(p.preBlur*s*.35); if(r>=1) cov=boxBlur(boxBlur(cov,W,H,r),W,H,r); }
        const ang=p.inks[j].angle*Math.PI/180, ca=Math.cos(ang), sa=Math.sin(ang), spot=spotFn(scr);
        const w=AM[scr]?Math.max(1e-3,p.softness*1.2/s):Math.max(1e-3,p.softness*.03);
        const gsz=Math.max(1,p.cell*k);
        for(let y=0;y<H;y++) for(let x=0;x<W;x++){
          const i=y*W+x; let t;
          if(spot){ const u=(x*ca+y*sa)/s, v=(-x*sa+y*ca)/s; t=spot(u-Math.floor(u)-.5, v-Math.floor(v)-.5); }
          else if(scr==='wave'){ const u=(x*ca+y*sa)/s, v=(-x*sa+y*ca)/s+.38*Math.sin(u*TAU/5); t=2*Math.abs(v-Math.floor(v)-.5); }
          else if(scr==='rings'){ const r=Math.hypot(x-cx,y-cy)/s; t=2*Math.abs(r-Math.floor(r)-.5); }
          else if(scr==='stochastic'){ t=hash((x/gsz)|0,(y/gsz)|0,jsd); }
          else if(scr==='bayer'){ t=BAYER[((((y/gsz)|0)&7)<<3)+(((x/gsz)|0)&7)]; }
          else if(scr==='noise'){ t=.62*vnoise(x/gsz,y/gsz,jsd)+.38*vnoise(x/(gsz*.4),y/(gsz*.4),jsd+3); }
          else t=.5;
          if(rough>0) t+=(.5*hash((x/k)|0,(y/k)|0,jsd)+.5*vnoise(x/(3*k),y/(3*k),jsd+7)-.5)*rough;
          const q=cov[i]*Lm; let base=Math.floor(q); if(base>=Lm) base=Lm-1; if(base<0) base=0;
          const f=q-base; let a=f<=.002?0:(f-t)/w+.5; a=a<0?0:a>1?1:a;
          O[i]=(base+a)/Lm;
        }
      }
      /* desgaste de tinta: falhas de carga, tela entupida */
      if(p.wear>0){
        const th=1-p.wear*.78;
        for(let y=0;y<H;y++) for(let x=0;x<W;x++){
          const i=y*W+x; if(O[i]<=0) continue;
          const m=.62*vnoise(x/(70*k),y/(70*k),jsd+101)+.38*vnoise(x/(8*k),y/(8*k),jsd+57);
          let f=1-.93*smooth(th-.07,th+.13,m);
          if(hash((x/(1.5*k))|0,(y/(1.5*k))|0,jsd+9)>1-p.wear*.07) f*=.12;
          O[i]*=f;
        }
      }
      /* letterpress: tinta acumula na borda das áreas impressas e falha um pouco no meio */
      if(p.press>0){
        const pr=Math.max(1,Math.round(2.5*k)), Bo=boxBlur(O,W,H,pr);
        for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x;
          O[i]=clamp01(O[i]*(1-.35*p.press*vnoise(x/(5*k),y/(5*k),jsd+301))+p.press*1.6*Math.max(0,O[i]-Bo[i])); }
      }
      outs.push(O);
    }

    /* 3b. traço de nanquim, lápis, aquarela, marmorizado e relevo do papel */
    const LN=(p.inkLines>0||p.inkFill>0)?inkLineMask(Lu,W,H,k,p,sd):null;
    const PD=p.mode==='pencil'?pencilMap(Lu,W,H,k,p,sd):null;
    const WCm=p.mode==='watercolor'?watercolorMap(R,G,B,W,H,k,p,sd,paper):null;
    const mar=p.mode==='marble', ink1c=hex(p.ink1), lineCol=p.mode==='lineart'?ink1c:hex('#141414');
    const mpal=mar?[hex(p.ink1),hex(p.ink2),paper,hex(p.ink3),hex(p.ink2),paper]:null, msc=Math.max(4,(p.marbleScale||60)*k), mwv=p.marbleWarp==null?1:p.marbleWarp;
    let TB=null, dbR=1;
    if(p.deboss>0&&outs.length){ const T=new Float32Array(N); for(const O of outs) for(let i=0;i<N;i++) if(O[i]>T[i]) T[i]=O[i];
      const rr=Math.max(1,Math.round(2*k)); TB=boxBlur(boxBlur(T,W,H,rr),W,H,rr); dbR=rr*1.2; }
    let colF=null, rowF=null;
    if(p.folds>0){ /* dobras: sombra de um lado, luz do outro e um vinco fino no meio */
      const nf=Math.max(1,p.foldGrid|0), sh=(d)=>{ const a=Math.abs(d); const w2=2*(1.3*k)*(1.3*k), e=d-2*k; return Math.sign(d)*Math.exp(-a/(45*k))*.07-Math.exp(-d*d/w2)*.22+Math.exp(-e*e/w2)*.1; };
      colF=new Float32Array(W); rowF=new Float32Array(H);
      for(let f=1;f<=nf;f++){ const fx=W*f/(nf+1)+(hash(f,1,sd+511)-.5)*W*.06, fy=H*f/(nf+1)+(hash(f,2,sd+513)-.5)*H*.06;
        for(let x=0;x<W;x++) colF[x]+=sh(x-fx); for(let y=0;y<H;y++) rowF[y]+=sh(y-fy); }
    }
    const rfW=(p.rollFrame||0)*.09*Math.min(W,H), mn=Math.min(W,H);

    /* 4. Composição (multiplicação sobre o papel) + texturas */
    const out=new Uint8ClampedArray(N*4), op=p.opacity;
    const offs=(p.offs||[]).map(o=>[Math.round(o.dx*k),Math.round(o.dy*k)]);
    const grad=p.mode==='gradmap'?p.grad.map(hex):null;
    const photo=p.mode==='photo', orig=p.mode==='original', amt=p.amount==null?1:p.amount, bm=p.blend||'normal';
    const FR=new Float32Array(N), FG=new Float32Array(N), FB=new Float32Array(N);
    const pt=p.paperTex, gr=p.grain, spk=p.specks, stk=p.streaks, du=p.dust, vg=p.vignette;
    const colAmt=new Float32Array(W);
    if(stk>0) for(let x=0;x<W;x++){ const c=(x/(1.3*k))|0; if(hash(c,3,sd+23)>1-stk*.035) colAmt[x]=.3+.7*hash(c,5,sd+27); }
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=y*W+x; let r,g,b;
      if(orig){ r=R[i]; g=G[i]; b=B[i]; }
      else if(PD){ const dd=PD[i]; r=paper[0]*(1-dd*(1-ink1c[0])); g=paper[1]*(1-dd*(1-ink1c[1])); b=paper[2]*(1-dd*(1-ink1c[2])); }
      else if(WCm){ r=WCm[0][i]; g=WCm[1][i]; b=WCm[2][i]; }
      else if(mar){ const c=marbleColor(x,y,msc,mwv,mpal,sd); r=c[0]; g=c[1]; b=c[2]; }
      else if(grad){
        const sg=outs[0][i]*3; let i0=sg|0; if(i0>2) i0=2; const f=sg-i0, A=grad[i0], Bc=grad[i0+1];
        r=A[0]+(Bc[0]-A[0])*f; g=A[1]+(Bc[1]-A[1])*f; b=A[2]+(Bc[2]-A[2])*f;
      } else {
        r=paper[0]; g=paper[1]; b=paper[2];
        for(let j=0;j<outs.length;j++){
          const o=offs[j]; let sx=x, sy=y;
          if(o){ sx=x-o[0]; sy=y-o[1]; if(sx<0) sx=0; else if(sx>=W) sx=W-1; if(sy<0) sy=0; else if(sy>=H) sy=H-1; }
          const si=sy*W+sx, v=outs[j][si]*op;
          if(v>0){
            if(photo){ const pr=R[si],pg=G[si],pb=B[si], mx=Math.max(pr,pg,pb,.02), f=Math.pow(mx,.6)/mx;
              r*=1-v*(1-pr*f); g*=1-v*(1-pg*f); b*=1-v*(1-pb*f); }
            else if(p.inks[j].white||p.opaque){ const c=inkCols[j]; r+=(c[0]-r)*v; g+=(c[1]-g)*v; b+=(c[2]-b)*v; }
            else { const c=inkCols[j]; r*=1-v*(1-c[0]); g*=1-v*(1-c[1]); b*=1-v*(1-c[2]); }
          }
        }
      }
      if(LN){ const l=LN[i]; if(l>0){ r+=(lineCol[0]-r)*l; g+=(lineCol[1]-g)*l; b+=(lineCol[2]-b)*l; } }
      if(TB){ const sh=((TB[y*W+ci(x-1,W-1)]-TB[y*W+ci(x+1,W-1)])+(TB[ci(y-1,H-1)*W+x]-TB[ci(y+1,H-1)*W+x]))*dbR, f=1+p.deboss*.6*sh; r*=f; g*=f; b*=f; }
      if(colF){ const f=1+p.folds*(colF[x]+rowF[y]); r*=f; g*=f; b*=f; }
      if(rfW>0){ /* moldura de rolo: tinta passada com rolo, borda irregular e estrias */
        const dE=Math.min(x,W-1-x,y,H-1-y);
        if(dE<rfW*1.7+3*k){ const along=(dE===x||dE===W-1-x)?y:x;
          const edge=rfW*(.55+.9*vnoise(along/(60*k),.5,sd+401)+.25*(vnoise(along/(6*k),1.5,sd+403)-.5));
          let ink=smooth(edge+1.5*k,edge-1.5*k,dE)*(.75+.25*vnoise(along/(2*k),dE/(40*k),sd+405));

        const a=p.aging; let ar=1-a*.04, ag=1-a*.1, ab=1-a*.28;
        const dd=Math.min(x,W-1-x,y,H-1-y)/(.14*mn);
        if(dd<1){ const eb=(1-dd)*(1-dd)*(.6+.8*vnoise(x/(50*k),y/(50*k),sd+601))*a; ar*=1-.25*eb; ag*=1-.38*eb; ab*=1-.55*eb; }
        const cs=40*k, cX=(x/cs)|0, cY=(y/cs)|0;
        if(hash(cX,cY,sd+603)>1-.22*a){ const ccx=(cX+.25+.5*hash(cX,cY,sd+605))*cs, ccy=(cY+.25+.5*hash(cX,cY,sd+607))*cs, rad=cs*(.08+.22*hash(cX,cY,sd+609));
          const d2=Math.hypot(x-ccx,y-ccy)/rad; if(d2<1){ const sp=(1-d2*d2)*(.5+.5*hash(cX,cY,sd+611)); ar*=1-.08*sp; ag*=1-.16*sp; ab*=1-.3*sp; } }
        r*=ar; g*=ag; b*=ab; }
      if(p.torn>0){ /* pôster rasgado: pedaços arrancados mostram a parede, com fibra branca na borda do rasgo */
        const n=.65*vnoise(x/(230*k),y/(230*k),sd+501)+.35*vnoise(x/(45*k),y/(45*k),sd+503)+.05*(vnoise(x/(3*k),y/(3*k),sd+505)-.5), th=1-p.torn*.42;
        if(n>th){ const cn=.8+.3*vnoise(x/(4*k),y/(4*k),sd+507); r=.55*cn; g=.54*cn; b=.51*cn; }
        else if(n>th-.025){ r=.95; g=.94; b=.9; }
        else { const st=1-.12*p.torn*smooth(.55,.8,vnoise(x/(120*k),y/(120*k),sd+509)); r*=st; g*=st*.98; b*=st*.95; } }
      let m=1;
      if(pt>0){ const f=.6*vnoise(x/(1.6*k),y/(16*k),sd+3)+.4*vnoise(x/(38*k),y/(38*k),sd+5); m*=1-pt*(.2*f+.05*hash((x/k)|0,(y/k)|0,sd+4)); }
      if(spk>0){ const cl=vnoise(x/(90*k),y/(90*k),sd+17);
        if(hash((x/(2*k))|0,(y/(2*k))|0,sd+19)>1-spk*.018*(.15+cl*1.7)) m*=.14; }
      if(stk>0){ m*=1-stk*.07*vnoise(.5,y/(260*k),sd+31);
        const ca=colAmt[x]; if(ca>0) m*=1-stk*.7*ca*(.35+.65*vnoise(x*.013,y/(140*k),sd+29)); }
      if(vg>0){ const nx=x/W-.5, ny=y/H-.5, dd=Math.sqrt(nx*nx+ny*ny)*1.414;
        m*=1-vg*.6*smooth(.38,1.05,dd)*(.6+.8*vnoise(x/(110*k),y/(110*k),sd+41)); }
      r*=m; g*=m; b*=m;
      FR[i]=r; FG[i]=g; FB[i]=b;
    }

    /* 5. câmera e filme */
    camera(p,FR,FG,FB,W,H,k,sd);

    /* 6. grão, poeira e mistura com a foto */
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=y*W+x; let r=FR[i], g=FG[i], b=FB[i];
      if(gr>0){ const n=(hash((x/k)|0,(y/k)|0,sd+11)-.5)*gr*.6; r+=n; g+=n; b+=n; }
      if(du>0 && hash((x/(1.5*k))|0,(y/(1.5*k))|0,sd+37)>1-du*.012){ r=r*.12+paper[0]*.88; g=g*.12+paper[1]*.88; b=b*.12+paper[2]*.88; }
      if(amt<1||bm!=='normal'){
        const o0=R[i],o1=G[i],o2=B[i]; r=clamp01(r); g=clamp01(g); b=clamp01(b);
        const bl=(e,o)=>bm==='multiply'?e*o:bm==='screen'?1-(1-e)*(1-o):bm==='overlay'?(o<.5?2*o*e:1-2*(1-o)*(1-e)):bm==='softlight'?(1-2*e)*o*o+2*e*o:e;
        r=o0+(bl(r,o0)-o0)*amt; g=o1+(bl(g,o1)-o1)*amt; b=o2+(bl(b,o2)-o2)*amt;
      }
      const q=i*4; out[q]=r*255; out[q+1]=g*255; out[q+2]=b*255; out[q+3]=255;
    }

    const transfer=[out.buffer], seps=[];
    if(d.seps){
      for(const O of outs){ const a=new Uint8ClampedArray(N*4);
        for(let i=0;i<N;i++){ const v=255*(1-O[i]); a[i*4]=a[i*4+1]=a[i*4+2]=v; a[i*4+3]=255; }
        seps.push(a.buffer); transfer.push(a.buffer); }
    }
    return {data:{buf:out.buffer,w:W,h:H,ms:Date.now()-t0,seps}, transfer};
  }
  return {processJob};
}

const LANGS=['pt','en','es'];
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||''); // dicas de atalho com ⌘ e ⌥ no Mac
const settings={theme:'dark',lang:(()=>{ const n=(navigator.language||'pt').toLowerCase(); return n.startsWith('es')?'es':n.startsWith('en')?'en':'pt'; })()};
try{ const s=JSON.parse(localStorage.getItem('ts-settings')||'null'); if(s){ if(['dark','light'].includes(s.theme)) settings.theme=s.theme; if(LANGS.includes(s.lang)) settings.lang=s.lang; } }catch(e){}
try{ const s=window.desktop&&window.desktop.savedSettings; if(s){ if(['dark','light'].includes(s.theme)) settings.theme=s.theme; if(LANGS.includes(s.lang)) settings.lang=s.lang; } }catch(e){}
function t(key,vars){
  let s=key; const row=I18N[key];
  if(row&&settings.lang!=='pt') s=row[settings.lang==='en'?0:1];
  if(vars) for(const k in vars) s=s.split('{'+k+'}').join(vars[k]);
  if(IS_MAC) s=s.replace('Ctrl+Shift+Z','⇧⌘Z').replace('Ctrl+Z','⌘Z').replace('Alt + ','⌥ + ').replace('touchpad','trackpad');
  return s;
}

/* ---------- worker ---------- */
let worker=null, E=null, wBusy=false, current=null; const queue=[];
try{
  const src='const E=('+engine.toString()+')();self.onmessage=function(e){var r=E.processJob(e.data);self.postMessage(r.data,r.transfer);};';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage=e=>{ const j=current; current=null; wBusy=false; j&&j.resolve(e.data); pump(); };
  worker.onerror=ev=>{ ev.preventDefault&&ev.preventDefault(); worker=null; E=engine(); const j=current; current=null; wBusy=false; j&&j.resolve(null); requestRender(); buildThumbs(); pump(); };
}catch(e){ worker=null; E=engine(); }
const PRIO={main:0,export:0,thumb:2};
function job(msg,transfer,kind){
  return new Promise(resolve=>{
    if(kind==='main') for(let i=queue.length-1;i>=0;i--) if(queue[i].kind==='main'){ queue[i].resolve(null); queue.splice(i,1); }
    queue.push({msg,transfer,kind,resolve}); queue.sort((a,b)=>PRIO[a.kind]-PRIO[b.kind]); pump();
  });
}
function pump(){
  if(wBusy||!queue.length) return;
  const j=queue.shift(); wBusy=true; current=j;
  if(worker){ worker.postMessage(j.msg,j.transfer); }
  else setTimeout(()=>{ let r=null; try{ r=E.processJob(j.msg).data; }catch(e){ console.error(e); } current=null; wBusy=false; j.resolve(r); pump(); },0);
}

function inkList(P){
  const base=inkListBase(P);
  if(P.white>0&&['mono','spot2','spot3','cmyk','comic','lineart'].includes(P.mode)) return [{name:t('Branco'),hex:'#F7F5EE',angle:P.angle+22,white:true},...base];
  return base;
}
function inkListBase(P){
  const b=P.angle;
  switch(P.mode){
    case 'mono': return [{name:inkName(P.ink1),hex:P.ink1,angle:b}];
    case 'photo': return [{name:t('Cores da foto'),hex:'#1D1D1B',angle:b}];
    case 'original': case 'pencil': case 'watercolor': case 'marble': return [];
    case 'lineart': return [{name:inkName(P.ink1),hex:P.ink1,angle:b}];
    case 'comic': return [{name:t('Ciano'),hex:'#1FA3DC',angle:b-30},{name:t('Magenta'),hex:'#E5317F',angle:b+30},{name:t('Amarelo'),hex:'#FFE03A',angle:b-45}];
    case 'gradmap': return [{name:t('Mapa'),hex:P.ink1,angle:b}];
    case 'spot2': return [P.ink1,P.ink2].map((h,i)=>({name:inkName(h),hex:h,angle:b+i*P.spread}));
    case 'spot3': return [P.ink1,P.ink2,P.ink3].map((h,i)=>({name:inkName(h),hex:h,angle:b+i*P.spread}));
    case 'cmyk': return [{name:t('Ciano'),hex:'#00A3E0',angle:b-30},{name:t('Magenta'),hex:'#E5007E',angle:b+30},{name:t('Amarelo'),hex:'#FFED00',angle:b-45},{name:t('Preto'),hex:'#1B1B1B',angle:b}];
  }
}
function rnd(n){ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function inkOffsets(P,n){
  const a=[]; for(let j=0;j<n;j++){
    if(j===0||P.misreg<=0){ a.push({dx:0,dy:0}); continue; }
    const ang=rnd(P.seed*31+j*7)*TAU, d=P.misreg*(.55+.45*rnd(P.seed*17+j*3));
    a.push({dx:Math.cos(ang)*d,dy:Math.sin(ang)*d});
  } return a;
}
const workerParams=(P,inks,offs,k)=>({...P,k,inks,offs,grad:[P.paper,P.ink3,P.ink2,P.ink1]});

/* ---------- composição da página (imagem + padrão + texto) ---------- */
// Os parâmetros em px valem para uma prévia de state.preview px no lado maior; k escala tudo para o tamanho pedido.
function compose(P,k,img,exact){
  const ar=board.w/board.h, REF=state.preview;
  const W0=ar>=1?REF:REF*ar, H0=ar>=1?REF/ar:REF;
  const W=exact?exact.w:Math.max(1,Math.round(W0*k)), H=exact?exact.h:Math.max(1,Math.round(H0*k));
  k=Math.max(W,H)/REF;
  let mp=P.margin; if((P.marks||P.colorBar)&&mp<6) mp=6;
  const m=Math.round(mp/100*Math.max(W,H));
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  const r={x:m,y:m,w:W-2*m,h:H-2*m};
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
  const iw=img.width, ih=img.height;
  if(board.fit==='cover'){ const sc=Math.max(r.w/iw,r.h/ih), sw=r.w/sc, sh=r.h/sc; x.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,r.x,r.y,r.w,r.h); }
  else if(board.fit==='contain'){ const sc=Math.min(r.w/iw,r.h/ih), dw=iw*sc, dh=ih*sc; x.drawImage(img,r.x+(r.w-dw)/2,r.y+(r.h-dh)/2,dw,dh); }
  else x.drawImage(img,r.x,r.y,r.w,r.h);
  if(P.bgPattern!=='none') drawPattern(x,r,P);
  if(P.text.trim()) drawText(x,r,P);
  return {canvas:c,ctx:x,W,H,inner:r,m,k};
}
function drawPattern(x,r,P){
  x.save(); x.beginPath(); x.rect(r.x,r.y,r.w,r.h); x.clip();
  x.fillStyle='rgba(0,0,0,'+P.bgAmount+')'; x.strokeStyle=x.fillStyle;
  const cx=r.x+r.w/2, cy=r.y+r.h/2, R=Math.hypot(r.w,r.h), n=P.bgCount;
  if(P.bgPattern==='rays'){ for(let i=0;i<n;i++){ const a0=i/n*TAU,a1=(i+.5)/n*TAU; x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,R,a0,a1); x.closePath(); x.fill(); } }
  else if(P.bgPattern==='stripes'){ const per=R/n; x.translate(cx,cy); x.rotate(-Math.PI/4); for(let s=-R;s<R;s+=per) x.fillRect(s,-R,per/2,2*R); }
  else if(P.bgPattern==='rings'){ const per=R/2/n*2; x.lineWidth=per/2; for(let rr=per/2;rr<R;rr+=per){ x.beginPath(); x.arc(cx,cy,rr,0,TAU); x.stroke(); } }
  else if(P.bgPattern==='dots'){ const per=r.w/n, rad=per*.3; for(let yy=r.y+per/2;yy<r.y+r.h;yy+=per) for(let xx=r.x+per/2;xx<r.x+r.w;xx+=per){ x.beginPath(); x.arc(xx,yy,rad,0,TAU); x.fill(); } }
  x.restore();
}
function drawText(x,r,P){
  let size=P.textSize/100*r.w; const t=P.text.trim();
  const font=s=>s+'px Anton, Impact, "Arial Narrow", sans-serif';
  x.save(); x.font=font(size);
  const mw=x.measureText(t).width; if(mw>r.w*.92){ size*=r.w*.92/mw; x.font=font(size); }
  x.textAlign='center'; x.textBaseline='middle';
  const cx=r.x+r.w/2, pad=r.h*.035;
  const y=P.textPos==='top'?r.y+pad+size*.62:P.textPos==='center'?r.y+r.h/2:r.y+r.h-pad-size*.62;
  if(P.textStyle==='outline'){ x.lineWidth=Math.max(1,size*.035); x.strokeStyle='#000'; x.lineJoin='round'; x.strokeText(t,cx,y); }
  else { x.fillStyle=P.textStyle==='white'?'#fff':'#000'; x.fillText(t,cx,y); }
  x.restore();
}

// Molduras de câmera e data impressa: desenhadas por cima da imagem já processada.
function drawFrame(ctx,W,H,P){
  const u=Math.min(W,H); let inner={x:0,y:0,w:W,h:H};
  const vt=s=>Math.round(s)+'px VT323, "IBM Plex Mono", monospace';
  ctx.save();
  if(P.frame==='polaroid'||P.frame==='instax'){
    const pol=P.frame==='polaroid', side=u*(pol?.055:.05), top=side*(pol?1:1.25), bot=u*(pol?.2:.17);
    inner={x:side,y:top,w:W-2*side,h:H-top-bot};
    ctx.fillStyle=pol?'#F3F1EA':'#FBFAF6';
    ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(inner.x,inner.y,inner.w,inner.h); ctx.fill('evenodd');
    ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=Math.max(1,u/500); ctx.strokeRect(inner.x,inner.y,inner.w,inner.h);
    if(!pol){ ctx.globalCompositeOperation='destination-in'; ctx.beginPath(); ctx.roundRect(0,0,W,H,u*.035); ctx.fill(); }
  } else if(P.frame==='film35'){
    const band=H*.11, side=W*.018;
    inner={x:side,y:band,w:W-2*side,h:H-2*band};
    ctx.fillStyle='#0E0D0C'; ctx.beginPath(); ctx.rect(0,0,W,H); ctx.roundRect(inner.x,inner.y,inner.w,inner.h,u*.01); ctx.fill('evenodd');
    const hw=band*.36, hh=band*.4, gap=hw*1.9; ctx.fillStyle='#E9E5DA';
    for(let x=gap*.5;x<W-hw;x+=gap){ ctx.beginPath(); ctx.roundRect(x,band*.1,hw,hh,hw*.2); ctx.roundRect(x,H-band*.1-hh,hw,hh,hw*.2); ctx.fill(); }
    ctx.fillStyle='#E8A33A'; ctx.font=vt(band*.3); ctx.textBaseline='middle';
    const ty=H-band*.72, ty2=band*.72; // texto entre os furos e a imagem
    ctx.textAlign='left'; ctx.fillText((P.look==='bw'?'KODAK 400TX':P.look==='fuji'?'FUJI SUPERIA 400':'KODAK PORTRA 400')+'   ▸ 14',W*.06,ty2);
    ctx.textAlign='right'; ctx.fillText('14A   ▸   15',W*.94,ty);
  } else if(P.frame==='super8'){
    const b=u*.045; inner={x:b,y:b,w:W-2*b,h:H-2*b};
    ctx.fillStyle='#0A0A0A'; ctx.beginPath(); ctx.rect(0,0,W,H); ctx.roundRect(inner.x,inner.y,inner.w,inner.h,u*.07); ctx.fill('evenodd');
  } else if(P.frame==='vhsosd'){
    const fs=H*.065, d=new Date(), mon=['JAN.','FEB.','MAR.','APR.','MAY','JUN.','JUL.','AUG.','SEP.','OCT.','NOV.','DEC.'][d.getMonth()];
    const hh=d.getHours(), mm=String(d.getMinutes()).padStart(2,'0');
    ctx.font=vt(fs); ctx.fillStyle='#F4F4F4'; ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowOffsetX=fs*.07; ctx.shadowOffsetY=fs*.07; ctx.textBaseline='top';
    ctx.textAlign='left'; ctx.fillText('PLAY ▶',W*.06,H*.07);
    ctx.textAlign='right'; ctx.fillText('SP',W*.94,H*.07);
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText((hh<12?'AM ':'PM ')+((hh%12)||12)+':'+mm,W*.06,H*.86);
    ctx.fillText(mon+' '+String(d.getDate()).padStart(2,'0')+' '+d.getFullYear(),W*.06,H*.93);
  }
  ctx.restore();
  return inner;
}
function drawDateStamp(ctx,inner){
  const d=new Date(), fs=Math.min(inner.w,inner.h)*.06, pad=fs*.8;
  const txt="'"+String(d.getFullYear()).slice(2)+' '+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getDate()).padStart(2,'0');
  ctx.save(); ctx.font=Math.round(fs)+'px VT323, "IBM Plex Mono", monospace'; ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.shadowColor='rgba(255,120,20,.9)'; ctx.shadowBlur=fs*.35; ctx.fillStyle='#FF8A1F';
  ctx.fillText(txt,inner.x+inner.w-pad,inner.y+inner.h-pad*.7); ctx.restore();
}
function drawOverlays(ctx,geo,P,inks,offs){
  if(P.frame&&P.frame!=='none'||P.dateStamp){ const inner=drawFrame(ctx,geo.W,geo.H,P); if(P.dateStamp) drawDateStamp(ctx,inner); }
  if(!(P.marks||P.colorBar)) return;
  const {inner:r,m,W,H,k}=geo, lw=Math.max(1,Math.min(W,H)/800);
  ctx.save(); ctx.globalCompositeOperation='multiply';
  const inkNW=inks.filter(i=>!i.white), cols=P.mode==='gradmap'?[{hex:P.ink1}]:inkNW.length?inkNW:[{hex:'#1B1B1B'}];
  if(P.marks) cols.forEach((ink,j)=>{
    const o=offs[j]||{dx:0,dy:0}; ctx.save(); ctx.translate(o.dx*k,o.dy*k);
    ctx.strokeStyle=ink.hex; ctx.lineWidth=lw;
    const gap=m*.22, len=m*.5; ctx.beginPath();
    [[r.x,r.y,-1,-1],[r.x+r.w,r.y,1,-1],[r.x,r.y+r.h,-1,1],[r.x+r.w,r.y+r.h,1,1]].forEach(([px,py,sx,sy])=>{
      ctx.moveTo(px+sx*gap,py); ctx.lineTo(px+sx*(gap+len),py); ctx.moveTo(px,py+sy*gap); ctx.lineTo(px,py+sy*(gap+len)); });
    ctx.stroke();
    const rr=m*.17;
    [[r.x+r.w/2,m/2],[r.x+r.w/2,H-m/2],[m/2,r.y+r.h/2],[W-m/2,r.y+r.h/2]].forEach(([tx,ty])=>{
      ctx.beginPath(); ctx.arc(tx,ty,rr,0,TAU); ctx.moveTo(tx+rr*.55,ty); ctx.arc(tx,ty,rr*.55,0,TAU);
      ctx.moveTo(tx-rr*1.5,ty); ctx.lineTo(tx+rr*1.5,ty); ctx.moveTo(tx,ty-rr*1.5); ctx.lineTo(tx,ty+rr*1.5); ctx.stroke(); });
    ctx.restore();
  });
  if(P.colorBar){
    const sw=P.mode==='gradmap'?[P.ink1,P.ink2,P.ink3,P.paper].map(h=>[h,1]):inks.flatMap(i=>[1,.7,.4,.2].map(t=>[i.hex,t]));
    const sq=Math.min(m*.36,(r.w/2-m*.5)/sw.length), y0=H-m/2-sq/2;
    sw.forEach(([h,t],i)=>{ ctx.globalAlpha=t; ctx.fillStyle=h; ctx.fillRect(r.x+i*sq,y0,sq*.92,sq); });
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    const txt=('Texture Supply by piraru* · '+label(MODES,P.mode)+' · '+label(SCREENS,P.screen)+(isAM(P)?' · '+P.cell+' px / '+Math.round(P.angle)+'°':'')).toUpperCase();
    let fs=Math.max(7,m*.15); ctx.font='500 '+fs+'px "IBM Plex Mono", monospace';
    const avail=r.w/2-m*.45; const tw=ctx.measureText(txt).width; if(tw>avail){ fs*=avail/tw; ctx.font='500 '+fs+'px "IBM Plex Mono", monospace'; }
    ctx.fillStyle=P.mode==='cmyk'?'#1B1B1B':P.ink1; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(txt,r.x+r.w,H-m/2);
  }
  ctx.restore();
}

/* ---------- render principal ---------- */
let raf=0, renderCount=0;
function requestRender(){ if(!raf) raf=setTimeout(()=>{ raf=0; renderMain(); },16); }
async function renderMain(){
  if(!state.img) return;
  const P=state.P, geo=compose(P,1,state.img), inks=inkList(P), offs=inkOffsets(P,inks.length);
  const id=geo.ctx.getImageData(0,0,geo.W,geo.H);
  $('busy').hidden=false;
  const res=await job({w:geo.W,h:geo.H,buf:id.data.buffer,p:workerParams(P,inks,offs,geo.k),seps:false},[id.data.buffer],'main');
  if(!res) return;
  $('busy').hidden=!queue.some(q=>q.kind==='main');
  const out=$('out'); out.width=res.w; out.height=res.h;
  const ctx=out.getContext('2d'); ctx.putImageData(new ImageData(new Uint8ClampedArray(res.buf),res.w,res.h),0,0);
  drawOverlays(ctx,geo,P,inks,offs);
  const sc=$('src'); sc.width=geo.W; sc.height=geo.H; sc.getContext('2d').drawImage(geo.canvas,0,0);
  state.lastGeo=geo; applyZoom();
  $('st-size').textContent=board.w+' × '+board.h+' px';
  $('st-time').textContent=t('prévia {w}×{h} · {ms} ms',{w:res.w,h:res.h,ms:res.ms});
  $('st-inks').innerHTML='';

/* ---------- miniaturas das receitas ---------- */
async function buildThumbs(){
  if(!state.img) return; const myId=state.imgId;
  for(const pr of PRESETS){
    if(myId!==state.imgId) return;
    const P={...DEFAULTS,...pr.p,seed:DEFAULTS.seed};
    const geo=compose(P,300/state.preview,state.img), inks=inkList(P), offs=inkOffsets(P,inks.length);
    const id=geo.ctx.getImageData(0,0,geo.W,geo.H);
    const res=await job({w:geo.W,h:geo.H,buf:id.data.buffer,p:workerParams(P,inks,offs,geo.k),seps:false},[id.data.buffer],'thumb');
    if(!res||myId!==state.imgId) continue;
    const c=document.querySelector('.preset[data-id="'+pr.id+'"] canvas'); c.width=res.w; c.height=res.h;
    const cx=c.getContext('2d'); cx.putImageData(new ImageData(new Uint8ClampedArray(res.buf),res.w,res.h),0,0);
    drawOverlays(cx,geo,P,inks,offs);
  }
}

/* ---------- visualização ---------- */
// Zoom relativo ao arquivo final: 100% = 1 pixel da prancheta por pixel da tela.
const ZMIN=.02, ZMAX=8;
function fitZoom(){
  const v=$('view'), dpr=window.devicePixelRatio||1, pad=48;
  return Math.max(ZMIN,Math.min((v.clientWidth-pad)/board.w,(v.clientHeight-pad)/board.h)*dpr);
}
const curZoom=()=>state.zoom==='fit'?fitZoom():state.zoom;
function applyZoom(){
  const z=curZoom(), dpr=window.devicePixelRatio||1, cw=board.w*z/dpr, ch=board.h*z/dpr;
  ['out','src'].forEach(id=>{ const c=$(id); c.style.width=cw+'px'; c.style.height=ch+'px'; });
  if(document.activeElement!==$('zoom-pct')) $('zoom-pct').value=Math.round(z*100);
  $('zoom-range').value=Math.round(Math.log2(z)*100);
  $('zoom-fit').setAttribute('aria-pressed',state.zoom==='fit');
  $('btn-zoom').setAttribute('aria-pressed',state.zoom!=='fit'&&Math.abs(z-1)<.005);
}
function setZoom(z,anchor){
  z=Math.min(ZMAX,Math.max(ZMIN,z));
  if(Math.abs(z-1)<.03) z=1; // gruda no 100%
  const v=$('view'), c=$('out').hidden?$('src'):$('out');
  if(!anchor){ const vr=v.getBoundingClientRect(); anchor={x:vr.left+vr.width/2,y:vr.top+vr.height/2}; }
  const r0=c.getBoundingClientRect(), fx=(anchor.x-r0.left)/r0.width, fy=(anchor.y-r0.top)/r0.height;
  state.zoom=z; applyZoom();
  const r1=c.getBoundingClientRect();
  v.scrollLeft+=r1.left+fx*r1.width-anchor.x; v.scrollTop+=r1.top+fy*r1.height-anchor.y;
}
const ZSTEPS=[.02,.03,.05,.0625,.0833,.125,.1667,.25,.333,.5,.667,1,1.5,2,3,4,6,8];
function stepZoom(dir){
  const z=curZoom(); let n=dir>0?ZSTEPS.find(s=>s>z*1.01):[...ZSTEPS].reverse().find(s=>s<z*.99);
  setZoom(n||z);
}
$('zoom-in').onclick=()=>stepZoom(1);
$('zoom-out').onclick=()=>stepZoom(-1);
$('zoom-range').addEventListener('input',e=>setZoom(Math.pow(2,e.target.value/100)));
$('zoom-pct').addEventListener('change',e=>{ const v=parseFloat(String(e.target.value).replace(',','.')); if(isFinite(v)&&v>0) setZoom(v/100); else applyZoom(); });
$('zoom-pct').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
$('zoom-pct').addEventListener('blur',applyZoom);
$('zoom-fit').onclick=()=>{ state.zoom='fit'; applyZoom(); };
$('btn-zoom').onclick=()=>{ if(state.zoom!=='fit'&&Math.abs(curZoom()-1)<.005){ state.zoom='fit'; applyZoom(); } else setZoom(1); };
(()=>{
  const v=$('view');
  // Alt + rolagem (ou Ctrl), e pinça no touchpad (chega como rolagem com Ctrl): zoom em volta do cursor.
  v.addEventListener('wheel',e=>{
    if(!(e.altKey||e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    const pinch=e.ctrlKey&&!e.altKey&&Math.abs(e.deltaY)<50;
    setZoom(curZoom()*Math.exp(-e.deltaY*(pinch?.01:.0025)),{x:e.clientX,y:e.clientY});
  },{passive:false});
  // Espaço + arrastar (ou botão do meio) move a prancheta.
  let over=false, space=false, drag=null;
  v.addEventListener('pointerenter',()=>over=true);
  v.addEventListener('pointerleave',()=>over=false);
  const typing=()=>['INPUT','TEXTAREA','SELECT'].includes((document.activeElement||{}).tagName);
  window.addEventListener('keydown',e=>{ if(e.code==='Space'&&over&&!typing()){ e.preventDefault(); if(!space){ space=true; v.classList.add('pan'); } } });
  window.addEventListener('keyup',e=>{ if(e.code==='Space'&&space){ e.preventDefault(); space=false; if(!drag) v.classList.remove('pan'); } });
  v.addEventListener('pointerdown',e=>{
    if(!(space||e.button===1)) return;
    e.preventDefault(); drag={x:e.clientX,y:e.clientY,l:v.scrollLeft,t:v.scrollTop};
    v.setPointerCapture(e.pointerId); v.classList.add('pan','dragging');
  });
  v.addEventListener('pointermove',e=>{ if(!drag) return; v.scrollLeft=drag.l-(e.clientX-drag.x); v.scrollTop=drag.t-(e.clientY-drag.y); });
  const end=()=>{ if(!drag) return; drag=null; v.classList.remove('dragging'); if(!space) v.classList.remove('pan'); };
  v.addEventListener('pointerup',end); v.addEventListener('pointercancel',end);
  if(window.ResizeObserver) new ResizeObserver(()=>{ if(state.zoom==='fit') requestAnimationFrame(applyZoom); }).observe(v);
})();

  im.onerror=()=>toast(t('Não consegui ler essa imagem. Tente exportá-la como JPG ou PNG.'));

window.addEventListener('paste',e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if(it) loadFile(it.getAsFile()); });

/* ---------- exportação ---------- */
const dlReady=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
function updateExportOptions(){
  const sel=$('exp-scale'), cur=sel.value||'1'; sel.innerHTML='';
  [.5,1,2].forEach(sc=>{
    const w=Math.round(board.w*sc), h=Math.round(board.h*sc);
    if(sc!==1&&(w*h>MAXMP*1e6||Math.max(w,h)>MAXSIDE)) return;
    const o=document.createElement('option'); o.value=sc; o.textContent=Math.round(sc*100)+'% · '+w+'×'+h; sel.append(o);
  });
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'1';
}
async function saveFile(name,blob){
  let dl=null; try{ dl=await dlReady; }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast(t('Arquivo salvo: {f}',{f:name})); }
    catch(e){ toast(e&&e.code==='declined'?t('Download cancelado.'):t('Não foi possível salvar aqui ({c}).',{c:(e&&e.code)||'error'})); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000); toast(t('Arquivo salvo: {f}',{f:name}));
}
const exportSize=()=>{ const sc=+$('exp-scale').value||1; return {w:Math.round(board.w*sc),h:Math.round(board.h*sc)}; };
async function renderAt(size,seps){
  const P=state.P, geo=compose(P,0,state.img,size), inks=inkList(P), offs=inkOffsets(P,inks.length);
  const id=geo.ctx.getImageData(0,0,geo.W,geo.H);
  const res=await job({w:geo.W,h:geo.H,buf:id.data.buffer,p:workerParams(P,inks,offs,geo.k),seps},[id.data.buffer],'export');
  if(!res) return null;
  const c=mk(res.w,res.h), ctx=c.getContext('2d'); ctx.putImageData(new ImageData(new Uint8ClampedArray(res.buf),res.w,res.h),0,0);
  drawOverlays(ctx,geo,P,inks,offs);
  return {canvas:c,res,inks};
}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
const baseName=()=>'texture-supply-'+(state.preset||'custom')+'-'+state.P.seed;
$('btn-export').onclick=async()=>{
  if(!state.img) return; const sz=exportSize(); toast(t('Renderizando {w} × {h} px…',sz),true);
  const r=await renderAt(sz,false); if(!r){ toast(t('A renderização falhou. Tente uma resolução menor.')); return; }
  await saveFile(baseName()+'-'+sz.w+'x'+sz.h+'.png',await toBlob(r.canvas));
};
$('btn-seps').onclick=async()=>{
  if(!state.img) return;
  if(!window.JSZip){ toast(t('A biblioteca de .zip não carregou. Exporte o PNG composto.')); return; }
  const sz=exportSize(); toast(t('Gerando separações {w} × {h} px…',sz),true);
  const r=await renderAt(sz,true); if(!r){ toast(t('A renderização falhou. Tente uma resolução menor.')); return; }
  const zip=new JSZip(); zip.file(t('composto')+'.png',await toBlob(r.canvas));
  const names=state.P.mode==='gradmap'?[t('tom')]:r.inks.map(i=>i.name);
  for(let j=0;j<r.res.seps.length;j++){
    const c=mk(r.res.w,r.res.h); c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(r.res.seps[j]),r.res.w,r.res.h),0,0);
    zip.file((j+1)+'-'+names[j].toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')+'.png',await toBlob(c));
  }
  await saveFile(baseName()+'-separacoes.zip',await zip.generateAsync({type:'blob'}));
};

/* ---------- toast ---------- */
let tt=0;
function toast(msg,sticky){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,sticky?8000:3200); }


/* ---------- prancheta: interface ---------- */
let boardClamped=false;
function saveBoard(){ try{ localStorage.setItem('ts-board',JSON.stringify(board)); }catch(e){} noteChange(); }
function ratioWH(){
  if(board.ratio==='original'){ const i=state.img; return i?i.width/i.height:board.w/board.h; }
  if(board.ratio==='free') return null;
  const v=RATIO_VAL[board.ratio]; return board.orient==='landscape'?v:1/v;
}
function clampBoard(){
  let w=Math.max(MINSIDE,Math.round(board.w)), h=Math.max(MINSIDE,Math.round(board.h));
  const sc=Math.min(1,MAXSIDE/Math.max(w,h),Math.sqrt(MAXMP*1e6/(w*h)));
  boardClamped=sc<1;
  if(boardClamped){ w=Math.max(MINSIDE,Math.floor(w*sc)); h=Math.max(MINSIDE,Math.floor(h*sc)); }
  board.w=w; board.h=h;
  if(w!==h) board.orient=w>h?'landscape':'portrait';
}
function fitRatio(anchor){ const r=ratioWH(); if(!r) return; if(anchor==='h') board.w=board.h*r; else board.h=board.w/r; }
function boardFromImage(){ const i=state.img; if(!i) return; board.w=i.width; board.h=i.height; clampBoard(); }
const toPx=v=>board.unit==='px'?v:v/UNIT_PER_IN[board.unit]*board.dpi;
const fromPx=v=>board.unit==='px'?Math.round(v):+(v/board.dpi*UNIT_PER_IN[board.unit]).toFixed(2);
const numTxt=v=>{ const x=String(v); return settings.lang==='en'?x:x.replace('.',','); };
const parseNum=x=>{ const v=parseFloat(String(x).replace(',','.')); return isFinite(v)&&v>0?v:null; };
let thumbTimer=0;
function rebuildThumbsSoon(){ clearTimeout(thumbTimer); thumbTimer=setTimeout(()=>{ state.imgId++; buildThumbs(); },700); }
function boardChanged(rethumb){ clampBoard(); saveBoard(); syncBoardUI(); syncAll(); updateExportOptions(); applyZoom(); requestRender(); if(rethumb) rebuildThumbsSoon(); }
const ORIENT_SVG={portrait:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="2.5" width="10" height="15" rx="1.5"/></svg>',
  landscape:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="15" height="10" rx="1.5"/></svg>'};
function buildBoard(root){
  const d=document.createElement('details'); d.open=true; d.id='board';
  const opt=list=>list.map(o=>'<option value="'+o[0]+'">'+t(o[1])+'</option>').join('');
  d.innerHTML='<summary>'+t('Prancheta')+'<small>'+t('tamanho e proporção')+'</small></summary><div class="fields">'
    +'<div class="field"><label for="b-ratio"><span>'+t('Proporção')+'</span></label><select id="b-ratio">'+opt(RATIOS)+'</select></div>'
    +'<div class="field"><label for="b-size"><span>'+t('Tamanhos prontos')+'</span></label><select id="b-size"><option value="">'+t('Escolher…')+'</option>'+SIZES.map(z=>'<option value="'+z[0]+'">'+t(z[1])+' · '+z[2]+'×'+z[3]+'</option>').join('')+'</select></div>'
    +'<div class="bgrid">'
    +'<div class="field"><label for="b-w"><span>'+t('Largura')+'</span></label><input class="num" id="b-w" type="text" inputmode="decimal" autocomplete="off"></div>'
    +'<div class="field"><label for="b-unit"><span>'+t('Unidade')+'</span></label><select id="b-unit">'+opt(UNITS)+'</select></div>'
    +'<div class="field"><label for="b-h"><span>'+t('Altura')+'</span></label><input class="num" id="b-h" type="text" inputmode="decimal" autocomplete="off"></div>'
    +'<div class="field"><span class="lbl">'+t('Orientação')+'</span><div class="orient">'
      +'<button type="button" id="b-portrait" title="'+t('Retrato')+'" aria-label="'+t('Retrato')+'">'+ORIENT_SVG.portrait+'</button>'
      +'<button type="button" id="b-landscape" title="'+t('Paisagem')+'" aria-label="'+t('Paisagem')+'">'+ORIENT_SVG.landscape+'</button></div></div>'
    +'</div>'
    +'<div class="field"><label for="b-dpi"><span>'+t('Resolução')+'</span></label><div class="dpirow"><input class="num" id="b-dpi" type="text" inputmode="numeric" autocomplete="off"><span>ppi</span></div></div>'
    +'<div class="field"><span class="lbl">'+t('Encaixe da imagem')+'</span><div class="seg" id="b-fit">'
      +'<button type="button" data-v="cover">'+t('Preencher')+'</button><button type="button" data-v="contain">'+t('Encaixar')+'</button><button type="button" data-v="stretch">'+t('Esticar')+'</button></div></div>'
    +'<div class="binfo" id="b-info"></div></div>';
  root.prepend(d);
  const $b=id=>d.querySelector('#'+id);
  $b('b-ratio').onchange=e=>{
    board.ratio=e.target.value;
    if(board.ratio==='original') boardFromImage();
    else if(board.ratio==='1:1'){ board.h=board.w; }
    else if(board.ratio!=='free'){
      // proporções de tela (16:9, 4:3…) começam na horizontal; formatos de papel, na vertical
      board.orient=['iso','letter','tabloid'].includes(board.ratio)?'portrait':'landscape';
      const long=Math.max(board.w,board.h), v=RATIO_VAL[board.ratio];
      if(board.orient==='landscape'){ board.w=long; board.h=long/v; } else { board.h=long; board.w=long/v; }
    }
    boardChanged(true);
  };
  $b('b-size').onchange=e=>{
    const z=SIZES.find(x=>x[0]===e.target.value); e.target.value=''; if(!z) return;
    board.w=z[2]; board.h=z[3]; board.dpi=z[4]; board.orient=z[2]>=z[3]?'landscape':'portrait';
    const q=Math.max(z[2],z[3])/Math.min(z[2],z[3]);
    board.ratio=Object.keys(RATIO_VAL).find(k=>Math.abs(RATIO_VAL[k]-q)/q<.006)||'free';
    boardChanged(true);
  };
  const commit=(key)=>{
    const el=$b('b-'+key), v=parseNum(el.value);
    if(v){ board[key]=toPx(v); fitRatio(key); boardChanged(false); } else syncBoardUI();
  };
  ['w','h'].forEach(key=>{
    const el=$b('b-'+key);
    el.addEventListener('change',()=>commit(key));
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ el.blur(); return; }
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){
        e.preventDefault();
        const step=(board.unit==='px'?1:.1)*(e.shiftKey?10:1)*(e.key==='ArrowUp'?1:-1);
        const cur=parseNum(el.value)||fromPx(board[key]);
        el.value=numTxt(+(cur+step).toFixed(2)); commit(key);
      }
    });
  });
  $b('b-unit').onchange=e=>{ board.unit=e.target.value; saveBoard(); syncBoardUI(); };
  $b('b-dpi').addEventListener('change',e=>{
    const v=parseNum(e.target.value); if(!v){ syncBoardUI(); return; }
    const pw=fromPx(board.w), ph=fromPx(board.h);
    board.dpi=Math.min(2400,Math.max(1,Math.round(v)));
    if(board.unit!=='px'){ board.w=toPx(pw); board.h=toPx(ph); }  // mantém o tamanho físico, como no Illustrator
    boardChanged(false);
  });
  $b('b-dpi').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
  ['portrait','landscape'].forEach(o=>$b('b-'+o).onclick=()=>{
    if(board.ratio==='original'||board.w===board.h) return;
    if((o==='landscape')!==(board.w>board.h)){ const w=board.w; board.w=board.h; board.h=w; }
    board.orient=o; boardChanged(true);
  });
  d.querySelectorAll('#b-fit button').forEach(b=>b.onclick=()=>{ board.fit=b.dataset.v; boardChanged(true); });
}
function syncBoardUI(){
  const d=$('board'); if(!d) return;
  const $b=id=>d.querySelector('#'+id);
  $b('b-ratio').value=board.ratio;
  $b('b-unit').value=board.unit;
  [['w',board.w],['h',board.h]].forEach(([k,v])=>{ const el=$b('b-'+k); if(document.activeElement!==el) el.value=numTxt(fromPx(v)); });
  if(document.activeElement!==$b('b-dpi')) $b('b-dpi').value=board.dpi;
  const sq=board.w===board.h, lockO=board.ratio==='original';
  $b('b-portrait').setAttribute('aria-pressed',!sq&&board.h>board.w); $b('b-landscape').setAttribute('aria-pressed',!sq&&board.w>board.h);
  $b('b-portrait').disabled=$b('b-landscape').disabled=lockO||sq;
  d.querySelectorAll('#b-fit button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===board.fit));
  const mp=(board.w*board.h/1e6).toFixed(1), cm=v=>numTxt((v/board.dpi*2.54).toFixed(1));
  $b('b-info').innerHTML='<b></b><br><span></span>'+(boardClamped?'<br><span class="warn"></span>':'');
  $b('b-info').querySelector('b').textContent=t('Arquivo final: {w} × {h} px · {mp} MP',{w:board.w,h:board.h,mp:numTxt(mp)});
  $b('b-info').querySelector('span').textContent=t('{a} × {b} cm a {d} ppi',{a:cm(board.w),b:cm(board.h),d:board.dpi});
  if(boardClamped) $b('b-info').querySelector('.warn').textContent=t('Limite de {mp} MP por arquivo: o tamanho foi reduzido.',{mp:MAXMP});
}

/* ---------- configurações: tema e idioma ---------- */
function applyTheme(){
  document.documentElement.dataset.ui=settings.theme;
  if(window.desktop&&window.desktop.setTheme) window.desktop.setTheme(settings.theme);
}
function relabel(){
  document.documentElement.lang={pt:'pt-BR',en:'en',es:'es'}[settings.lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('.preset').forEach(b=>{ const pr=PRESETS.find(p=>p.id===b.dataset.id); b.querySelector('span').textContent=t(pr.n); });
  const open=[...document.querySelectorAll('#controls details')].map(d=>d.open);
  clampBoard();
  $('controls').innerHTML=''; for(const k in fieldEls) delete fieldEls[k];
  buildControls();
  document.querySelectorAll('#controls details').forEach((d,i)=>{ if(i<open.length) d.open=open[i]; });
  syncBoardUI(); syncAll(); applyZoom();
  if(window.desktop&&window.desktop.setLanguage) window.desktop.setLanguage(settings.lang);
}
function saveSettings(){ try{ localStorage.setItem('ts-settings',JSON.stringify(settings)); }catch(e){} }
function syncSettingsUI(){
  document.querySelectorAll('#set-theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===settings.theme));
  document.querySelectorAll('#set-lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===settings.lang));
}
document.querySelectorAll('#set-theme button').forEach(b=>b.onclick=()=>{ settings.theme=b.dataset.v; applyTheme(); syncSettingsUI(); saveSettings(); });
document.querySelectorAll('#set-lang button').forEach(b=>b.onclick=()=>{
  if(settings.lang===b.dataset.v) return;
  settings.lang=b.dataset.v; syncSettingsUI(); saveSettings(); relabel();
  if($('sample').value==='chart') setImage(sampleChart(),'chart'); else requestRender();
});
$('btn-settings').onclick=()=>{ syncSettingsUI(); const d=$('settings'); if(d.showModal) d.showModal(); else d.setAttribute('open',''); };
$('set-close').onclick=()=>{ const d=$('settings'); if(d.close) d.close(); else d.removeAttribute('open'); };
$('settings').addEventListener('click',e=>{ if(e.target===e.currentTarget) $('set-close').click(); });

/* ---------- desfazer / refazer (Ctrl+Z, Ctrl+Shift+Z, Ctrl+Y) ---------- */
// Cada estado guarda os ajustes, a receita e a prancheta. Mudanças seguidas (arrastar um controle,
// digitar um texto) viram um passo só quando param por 350 ms.
const HIST_MAX=100;
let past=[], future=[], baseline=null, histTimer=0, restoring=false;
const snapshot=()=>JSON.stringify({P:state.P,preset:state.preset,b:board});
function syncHistButtons(){ $('btn-undo').disabled=!past.length&&!histTimer; $('btn-redo').disabled=!future.length; }
function commitHistory(){
  clearTimeout(histTimer); histTimer=0;
  const cur=snapshot();
  if(baseline!==null&&cur!==baseline){ past.push(baseline); if(past.length>HIST_MAX) past.shift(); future=[]; }
  baseline=cur; syncHistButtons();
}
function noteChange(){
  if(restoring||baseline===null) return;
  clearTimeout(histTimer); histTimer=setTimeout(commitHistory,350); syncHistButtons();
}
function resetHistory(){ clearTimeout(histTimer); histTimer=0; past=[]; future=[]; baseline=snapshot(); syncHistButtons(); }
function restoreSnapshot(str){
  const o=JSON.parse(str), prevAspect=board.w/board.h, prevFit=board.fit;
  restoring=true;
  state.P={...DEFAULTS,...o.P}; state.preset=o.preset; Object.assign(board,o.b);
  persist(); saveBoard();
  restoring=false;
  baseline=str;
  syncBoardUI(); syncAll(); updateExportOptions(); applyZoom(); requestRender();
  if(Math.abs(board.w/board.h-prevAspect)>.001||board.fit!==prevFit) rebuildThumbsSoon();
  syncHistButtons();
}
function undo(){
  if(histTimer) commitHistory();
  if(!past.length){ toast(t('Nada para desfazer')); return; }
  future.push(baseline); restoreSnapshot(past.pop()); toast(t('Desfeito'));
}
function redo(){
  if(histTimer) commitHistory();
  if(!future.length){ toast(t('Nada para refazer')); return; }
  past.push(baseline); restoreSnapshot(future.pop()); toast(t('Refeito'));
}
// Em campos de texto, Ctrl+Z desfaz a digitação do próprio campo (como no Photoshop).
const editingText=()=>{ const a=document.activeElement; return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&['text','number','search'].includes(a.type))); };
function undoCommand(){ if(editingText()) document.execCommand('undo'); else undo(); }
function redoCommand(){ if(editingText()) document.execCommand('redo'); else redo(); }
window.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey||editingText()) return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); redo(); }
});
$('btn-undo').onclick=undo;
$('btn-redo').onclick=redo;

/* ---------- início ---------- */
applyTheme(); buildPresets(); relabel();
$('btn-rand').onclick=surprise;
setImage(sampleSunset(),'sunset');
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('40px Anton'),document.fonts.load('12px "IBM Plex Mono"'),document.fonts.load('20px VT323')]).then(()=>{
    if($('sample').value==='chart') setImage(sampleChart(),'chart'); else requestRender();
    state.imgId++; renderCount=1; buildThumbs();
  }).catch(()=>{});
}
window.addEventListener('resize',()=>{ if(state.zoom==='fit') applyZoom(); });
</script>
